## Basic Configuration
baseurl = "/"
languageCode = "en-GB"
languageLang = "en"
title = "Kind"
disableHugoGeneratorInject = true
author = "Future Friendly Ltd."
copyright = "Future Friendly Ltd."
canonifyURLs = true
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
summarylength = 10
paginate = 6
ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]
timeout = "300s"

# llms.txt is generated from content (layouts/index.llms.txt); the only RSS
# feed is the blog's (enabled in content/blog/_index.md)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "llms"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  ordered = true

# Remote fetches (image dimensions from imgix) live under resources/ so
# netlify-plugin-hugo-cache-resources keeps them between deploys
[caches]
  [caches.getresource]
    dir = ":resourceDir/_gen/getresource"
    maxAge = -1

[module]

[[module.mounts]]
  source = "images"
  target = "src/images"

## Site Settings
[params]
  author = "Kind"
  date_format = "January 2, 2006"
  description = "Ethical creative agency for charities and non-profits"
  email = "hello@madebykind.com"
  images = ["/img/site-feature-image.png"]
  phone = "+441157270990"
  phonePretty = "0115 727 0990"
  since = 2009

  logo = "https://madebykind.imgix.net/kind-logo-blue.png"
  address = { street = "16 Commerce Square", locality = "Nottingham", postcode = "NG1 1HS", country = "GB" }

  linkedin = "https://www.linkedin.com/company/madebykind/"
  instagram = "https://www.instagram.com/madebykind/"
  bluesky = "https://bsky.app/profile/madebykind.bsky.social"

  # Table of contents
  toc = "tocbot"

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = true
    respectDoNotTrack = true
    useSessionStorage = true
  [privacy.instagram]
    disable = false
    simple = false
  [privacy.twitter]
    disable = false
    enableDNT = true
    simple = true
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[related]
  includeNewer = true
  toLower = true
  [[related.indices]]   
    name = "topics"
    weight = 100
  [[related.indices]]
    name = "services"
    weight = 10 

[services]
  [services.twitter]
    disableInlineCSS = true

[taxonomies]
  key_topic = "key_topic"
  topic = "topics"

[permalinks]
  sectors = "/:slug/"
  impact-reports = "/about/our-impact/:slug/"