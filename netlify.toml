
[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  HUGO_VERSION = "0.136.5"
  NODE_VERSION = "19.5.0"

[context.production.environment]
  HUGO_ENV = "production"
  NODE_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "development"

[context.branch-deploy.environment]
  HUGO_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    #Content-Security-Policy = '''
    # base-uri 'none';
    # font-src 'self';
    # frame-ancestors 'none';
    # object-src 'none';
    # script-src 'self' https://identity.netlify.com/v1/netlify-identity-widget.js https://unpkg.com/netlify-cms@%5E2.0.0/dist/netlify-cms.js;
    # style-src 'self';
    # '''    
    Permissions-Policy = '''
    accelerometer=(),
    camera=(),
    geolocation=(),
    gyroscope=(),
    interest-cohort=(),
    magnetometer=(),
    microphone=(),
    payment=(),
    usb=()
    '''
    Netlify-CDN-Cache-Control = '''
    public,
    s-maxage=31536000,
    must-revalidate
    '''
    Strict-Transport-Security = '''
    max-age=31536000;
    includeSubDomains;
    preload
    '''
    # No browser cache-control here: pages get Netlify's default
    # (public, max-age=0, must-revalidate), so browsers check for a new
    # version on every visit. The CDN still caches them (above) and is
    # purged on each deploy.

# Built CSS/JS (cache-busted with ?timestamp) and fonts: keep in the browser for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/font-woff2"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"

[[plugins]]
  package = "netlify-purge-cloudflare-on-deploy"